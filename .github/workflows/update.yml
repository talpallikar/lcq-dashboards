name: Update LCQ Data

on:
  schedule:
    # Run daily at 10:00 UTC (after MTGO events typically post results)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape MTGO LCQ results
        run: python scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data.js && echo "No changes" && exit 0
          git add data.js
          git commit -m "Update LCQ data $(date -u +%Y-%m-%d)"
          git push
