<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTGO Last Chance Results</title>
  <meta name="description" content="Dashboard tracking Vintage, Legacy, Modern, and Standard Last Chance event results on Magic: The Gathering Online.">
  <link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <header>
    <div class="header-row">
      <h1><a href="./">MTGO Last Chance Results</a></h1>
      <button id="theme-toggle" aria-label="Toggle theme">◐</button>
    </div>
    <nav>
      <button class="tab active" data-format="all">All</button>
      <button class="tab" data-format="vintage">Vintage</button>
      <button class="tab" data-format="legacy">Legacy</button>
      <button class="tab" data-format="modern">Modern</button>
      <button class="tab" data-format="standard">Standard</button>
    </nav>
  </header>

  <main>
    <section id="stats" class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="stat-events">—</span>
        <span class="stat-label">Events</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-decklists">—</span>
        <span class="stat-label">Total Decklists</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-latest">—</span>
        <span class="stat-label">Latest Event</span>
      </div>
    </section>

    <section id="meta-section">
      <h2>Overall Metagame</h2>
      <div id="meta-bars"></div>
    </section>

    <section id="events-section">
      <h2>Events</h2>
      <div id="events-list"></div>
      <p id="no-events" class="empty" hidden>No events found.</p>
    </section>
  </main>

  <footer>
    <p>Data sourced from MTGO Last Chance event results. <a href="https://github.com/talpallikar/lcq-dashboards">Source on GitHub</a></p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
